<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>AI VTuber Chat</title>
    <meta name="theme-color" content="#1b1530">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "@anthropic-ai/sdk": "https://esm.sh/@anthropic-ai/sdk@0.131.0"
        }
    }
    </script>
</head>
<body>
    <div class="stage" id="stage">
        <!-- 背景（配信部屋風） -->
        <div class="bg">
            <div class="bg-window"></div>
            <div class="bg-light"></div>
        </div>

        <!-- キャラクター -->
        <div class="character-wrap" id="characterWrap">
            <svg id="character" class="character emotion-neutral" viewBox="0 0 400 520" aria-label="キャラクター">
                <defs>
                    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#b8a6ff"/>
                        <stop offset="1" stop-color="#7a64e0"/>
                    </linearGradient>
                    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
                        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
                    </linearGradient>
                    <radialGradient id="irisGrad" cx=".5" cy=".35" r=".7">
                        <stop offset="0" stop-color="#7ef0ff"/>
                        <stop offset=".55" stop-color="#3b8fe0"/>
                        <stop offset="1" stop-color="#23367a"/>
                    </radialGradient>
                    <linearGradient id="outfitGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#2d2a4a"/>
                        <stop offset="1" stop-color="#1c1a33"/>
                    </linearGradient>
                </defs>

                <g id="body" class="body">
                    <!-- 後ろ髪 -->
                    <path class="hair-back" fill="url(#hairGrad)" d="M95 170 C80 260 70 360 95 450 L150 430 C140 360 140 300 150 250 Z"/>
                    <path class="hair-back" fill="url(#hairGrad)" d="M305 170 C320 260 330 360 305 450 L250 430 C260 360 260 300 250 250 Z"/>

                    <!-- 胴体 -->
                    <path fill="url(#outfitGrad)" d="M110 520 C110 430 140 380 200 375 C260 380 290 430 290 520 Z"/>
                    <path fill="#f6dccf" d="M180 330 L220 330 L222 380 C210 392 190 392 178 380 Z"/>
                    <path fill="#ffffff" d="M165 385 L200 420 L235 385 L245 395 L200 450 L155 395 Z" opacity=".95"/>
                    <path fill="#ff6fa5" d="M188 412 L200 425 L212 412 L206 440 L194 440 Z"/>
                    <circle cx="140" cy="470" r="6" fill="#7ef0ff" opacity=".8"/>
                    <circle cx="260" cy="470" r="6" fill="#7ef0ff" opacity=".8"/>

                    <!-- 頭 -->
                    <g id="head" class="head">
                        <!-- 顔 -->
                        <path fill="#fde6da" d="M125 200 C125 120 160 90 200 90 C240 90 275 120 275 200 C275 270 240 330 200 340 C160 330 125 270 125 200 Z"/>
                        <!-- 耳 -->
                        <ellipse cx="124" cy="215" rx="10" ry="18" fill="#f6d2c3"/>
                        <ellipse cx="276" cy="215" rx="10" ry="18" fill="#f6d2c3"/>

                        <!-- 頬 -->
                        <g class="blush">
                            <ellipse cx="157" cy="262" rx="18" ry="9" fill="#ff8fb1"/>
                            <ellipse cx="243" cy="262" rx="18" ry="9" fill="#ff8fb1"/>
                            <g class="blush-lines" stroke="#ff6f9b" stroke-width="2" stroke-linecap="round">
                                <line x1="148" y1="258" x2="144" y2="266"/><line x1="156" y1="258" x2="152" y2="266"/><line x1="164" y1="258" x2="160" y2="266"/>
                                <line x1="236" y1="258" x2="232" y2="266"/><line x1="244" y1="258" x2="240" y2="266"/><line x1="252" y1="258" x2="248" y2="266"/>
                            </g>
                        </g>

                        <!-- 目 -->
                        <g id="eyes" class="eyes">
                            <g class="eye eye-l" transform="translate(163 222)">
                                <g class="eye-open">
                                    <ellipse rx="21" ry="25" fill="#fff"/>
                                    <g class="pupil">
                                        <ellipse rx="15" ry="20" fill="url(#irisGrad)"/>
                                        <ellipse rx="7" ry="10" fill="#141433"/>
                                        <circle cx="-5" cy="-9" r="5" fill="#fff"/>
                                        <circle cx="5" cy="7" r="2.5" fill="#fff" opacity=".8"/>
                                    </g>
                                    <path d="M-24 -22 Q0 -36 24 -20" stroke="#2b2350" stroke-width="5" fill="none" stroke-linecap="round"/>
                                </g>
                                <path class="eye-closed" d="M-20 2 Q0 14 20 2" stroke="#2b2350" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                                <path class="eye-happy" d="M-19 6 Q0 -14 19 6" stroke="#2b2350" stroke-width="5" fill="none" stroke-linecap="round"/>
                                <path class="eye-angry" d="M-20 -4 L20 6 M-18 -2 Q0 22 18 6" stroke="#2b2350" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                            </g>
                            <g class="eye eye-r" transform="translate(237 222)">
                                <g class="eye-open">
                                    <ellipse rx="21" ry="25" fill="#fff"/>
                                    <g class="pupil">
                                        <ellipse rx="15" ry="20" fill="url(#irisGrad)"/>
                                        <ellipse rx="7" ry="10" fill="#141433"/>
                                        <circle cx="-5" cy="-9" r="5" fill="#fff"/>
                                        <circle cx="5" cy="7" r="2.5" fill="#fff" opacity=".8"/>
                                    </g>
                                    <path d="M-24 -20 Q0 -36 24 -22" stroke="#2b2350" stroke-width="5" fill="none" stroke-linecap="round"/>
                                </g>
                                <path class="eye-closed" d="M-20 2 Q0 14 20 2" stroke="#2b2350" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                                <path class="eye-happy" d="M-19 6 Q0 -14 19 6" stroke="#2b2350" stroke-width="5" fill="none" stroke-linecap="round"/>
                                <path class="eye-angry" d="M20 -4 L-20 6 M18 -2 Q0 22 -18 6" stroke="#2b2350" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                            </g>
                        </g>

                        <!-- 眉 -->
                        <g class="brows" stroke="#5a48b0" stroke-width="4" stroke-linecap="round" fill="none">
                            <path class="brow brow-l" d="M146 182 Q163 175 180 180"/>
                            <path class="brow brow-r" d="M220 180 Q237 175 254 182"/>
                        </g>

                        <!-- 口 -->
                        <g class="mouth" transform="translate(200 290)">
                            <path class="mouth-neutral" d="M-9 0 Q0 6 9 0" stroke="#8a3a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                            <path class="mouth-smile" d="M-14 -3 Q0 14 14 -3" stroke="#8a3a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                            <path class="mouth-sad" d="M-11 5 Q0 -5 11 5" stroke="#8a3a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                            <path class="mouth-angry" d="M-12 4 L-4 -1 L4 3 L12 -2" stroke="#8a3a4a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                            <path class="mouth-thinking" d="M-6 2 Q2 -2 10 3" stroke="#8a3a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                            <path class="mouth-shy" d="M-10 2 Q-5 -2 0 2 Q5 6 10 2" stroke="#8a3a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <!-- 発話用（開いた口） -->
                            <g class="mouth-open">
                                <ellipse id="mouthOpen" rx="11" ry="9" fill="#a83e55"/>
                                <ellipse cy="5" rx="6" ry="3" fill="#ff8fa3"/>
                            </g>
                        </g>

                        <!-- 前髪 -->
                        <path fill="url(#hairGrad)" d="M115 210 C105 110 160 70 205 72 C255 74 300 115 285 215 C275 175 262 150 245 135 C248 160 240 175 232 182 C228 160 218 140 205 128 C200 150 188 168 172 178 C176 160 172 145 168 136 C150 150 135 175 115 210 Z"/>
                        <path fill="url(#hairHi)" d="M150 110 C175 95 220 92 250 110 C230 105 190 104 160 120 Z"/>
                        <!-- アホ毛 -->
                        <path class="ahoge" fill="url(#hairGrad)" d="M200 76 C192 50 205 30 225 28 C210 38 206 55 208 76 Z"/>
                        <!-- 髪飾り -->
                        <g class="hairpin" transform="translate(255 125) rotate(20)">
                            <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#ffe36e"/>
                        </g>

                        <!-- 感情エフェクト -->
                        <g class="fx fx-happy">
                            <path d="M95 120 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#ffe36e"/>
                            <path d="M305 100 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" fill="#ffe36e"/>
                            <path d="M318 160 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#fff"/>
                        </g>
                        <g class="fx fx-sad">
                            <path d="M150 248 Q146 262 150 270 Q156 262 150 248 Z" fill="#8fd8ff"/>
                            <path d="M290 150 Q280 170 290 182 Q300 170 290 150 Z" fill="#8fd8ff" opacity=".9"/>
                        </g>
                        <g class="fx fx-angry"><g transform="translate(275 115)" stroke="#ff4d6d" stroke-width="5" stroke-linecap="round" fill="none">
                            <path d="M-14 -4 Q-6 -6 -4 -14"/><path d="M4 -14 Q6 -6 14 -4"/>
                            <path d="M14 4 Q6 6 4 14"/><path d="M-4 14 Q-6 6 -14 4"/>
                        </g></g>
                        <g class="fx fx-surprised" fill="#ff6fa5">
                            <rect x="300" y="80" width="10" height="34" rx="5"/>
                            <circle cx="305" cy="126" r="6"/>
                            <rect x="318" y="88" width="8" height="26" rx="4" opacity=".7"/>
                            <circle cx="322" cy="122" r="5" opacity=".7"/>
                        </g>
                        <g class="fx fx-thinking">
                            <circle cx="300" cy="140" r="5" fill="#fff" opacity=".85"/>
                            <circle cx="315" cy="118" r="8" fill="#fff" opacity=".85"/>
                            <text x="318" y="96" font-size="36" font-weight="bold" fill="#fff">?</text>
                        </g>
                        <g class="fx fx-shy">
                            <text x="290" y="110" font-size="30" fill="#ff6fa5">♡</text>
                            <text x="80" y="140" font-size="22" fill="#ff8fb1">♡</text>
                        </g>
                    </g>
                </g>
            </svg>
        </div>

        <!-- 配信風ヘッダー -->
        <header class="topbar">
            <div class="live-badge"><span class="dot"></span>LIVE</div>
            <div class="title">AI VTuber Chat</div>
            <div class="top-actions">
                <button id="ttsBtn" class="icon-btn" title="読み上げ">🔇</button>
                <button id="settingsBtn" class="icon-btn" title="設定">⚙</button>
            </div>
        </header>

        <!-- チャット -->
        <section class="chat" id="chat">
            <div class="messages" id="messages"></div>
            <form class="composer" id="composer">
                <textarea id="input" rows="1" placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"></textarea>
                <button type="submit" id="sendBtn" class="send-btn">送信</button>
            </form>
        </section>
    </div>

    <!-- 設定ダイアログ -->
    <dialog id="settingsDialog" class="settings">
        <form method="dialog" id="settingsForm">
            <h2>設定</h2>
            <label>Anthropic API キー
                <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
            </label>
            <p class="note">キーはこのブラウザの localStorage にのみ保存され、Anthropic API へ直接送信されます。空欄の場合はデモモード（簡易応答）で動作します。共有PCでは入力しないでください。</p>
            <label>モデル
                <select id="modelSelect">
                    <option value="claude-opus-5-5">Claude Opus 5.5</option>
                    <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
                    <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
                </select>
            </label>
            <label>キャラクター名
                <input type="text" id="charNameInput" maxlength="20">
            </label>
            <label>キャラクター設定（性格・口調など）
                <textarea id="personaInput" rows="4"></textarea>
            </label>
            <div class="dialog-actions">
                <button type="button" id="clearHistoryBtn" class="danger">会話をリセット</button>
                <span class="spacer"></span>
                <button value="cancel" formnovalidate>キャンセル</button>
                <button value="save" id="saveSettingsBtn" class="primary">保存</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
